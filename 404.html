<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found | Ankit Tiwari</title>
    <meta name="description" content="The page you are looking for does not exist." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.png" />
    <link rel="apple-touch-icon" href="images/app-icon.png" />
    <style>
      @font-face {
        font-family: "Satoshi";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("images/satoshi-regular.woff2") format("woff2");
      }
      :root {
        --color--background: #fffdf3;
        --color--text: #1b1b1b;
        --color--greys: #7a7a7a;
        --color--toggle-offset: #f2d184;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background-color: var(--color--background);
        color: var(--color--text);
        font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100vh;
        padding: 32px;
        overflow-x: hidden;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        font-size: 16px;
        font-weight: 500;
        text-decoration: none;
        color: inherit;
      }
      .main {
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
        padding: 64px 0;
      }
      .code {
        font-size: clamp(120px, 26vw, 320px);
        line-height: 0.85;
        letter-spacing: -0.04em;
        font-weight: 400;
        margin: 0;
      }
      .title {
        font-size: clamp(20px, 3.4vw, 32px);
        font-weight: 400;
        line-height: 1.2;
        margin: 0;
        max-width: 18ch;
      }
      .text {
        font-size: 16px;
        line-height: 1.5;
        color: var(--color--greys);
        margin: 0;
        max-width: 46ch;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }
      .button {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 15px;
        border: 1px solid var(--color--text);
      }
      .button-solid {
        background-color: var(--color--text);
        color: var(--color--background);
      }
      .button-plain {
        color: var(--color--text);
      }
      .footer {
        font-size: 13px;
        color: var(--color--greys);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .footer a {
        color: inherit;
      }
      @media (max-width: 767px) {
        body {
          padding: 24px;
        }
        .main {
          padding: 40px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <a class="brand" href="/">Ankit Tiwari</a>
    </div>
    <main class="main">
      <h1 class="code">404</h1>
      <h2 class="title">This page went off the grid.</h2>
      <p class="text">
        The page you are looking for was moved, renamed, or never existed. Head back home or browse the
        selected work.
      </p>
      <div class="actions">
        <a class="button button-solid" href="/">Back to home</a>
        <a class="button button-plain" href="/work">See all work</a>
      </div>
    </main>
    <div class="footer">
      <span>&copy; <span id="year">2026</span> Ankit Tiwari</span>
      <span><a href="/about">About</a> &middot; <a href="/playground">Playground</a> &middot; <a href="/work">Work</a></span>
    </div>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
